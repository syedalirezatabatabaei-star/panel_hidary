<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172b45">
  <title>ورود | پنل شرکت خاقانی نوین سپاهان</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-v12">
    <div class="login-v12-overlay" aria-hidden="true"></div>
    <section class="login-v12-card" aria-labelledby="loginTitle">
      <div class="login-v12-avatar">
        <img src="images/logo.png" alt="لوگوی شرکت خاقانی نوین سپاهان">
      </div>
      <p class="login-v12-kicker">سامانه مدیریت</p>
      <h1 id="loginTitle">پنل شرکت خاقانی نوین سپاهان</h1>
      <p class="login-v12-subtitle">برای ورود به حساب کاربری خود اطلاعات زیر را وارد کنید</p>
      <form id="loginForm" class="login-v12-form">
        <label class="sr-only" for="username">نام کاربری</label>
        <input id="username" name="username" type="text" placeholder="نام کاربری" autocomplete="username" required>
        <label class="sr-only" for="password">رمز عبور</label>
        <div class="login-v12-password">
          <input id="password" name="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="password-visibility" aria-label="نمایش رمز عبور" aria-pressed="false">
            <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.5 0 2.8-.4 4-1"/></svg>
          </button>
        </div>
        <p id="error" class="form-error" role="alert" aria-live="polite"></p>
        <button class="login-v12-submit" type="submit">ورود به سامانه</button>
      </form>
    </section>
    <footer class="login-v12-footer">© تمامی حقوق محفوظ است</footer>
  </main>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/login.js"></script>

</body>
</html>
