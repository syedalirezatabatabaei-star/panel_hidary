name: panel-hidary

services:
  mysql:
    image: mysql:8.4
    container_name: panel-hidary-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-panel_hidary}
      MYSQL_USER: ${MYSQL_USER:-panel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - panel_hidary_mysql_data:/var/lib/mysql
    networks:
      - database_network
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 1m

  postgres:
    image: postgres:17
    container_name: panel-hidary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panel_hidary_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-panel_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - panel_hidary_postgres_data:/var/lib/postgresql/data
    networks:
      - database_network
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 1m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    container_name: panel-hidary-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-panel_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}@mysql:3306/${MYSQL_DATABASE:-panel_hidary}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in root .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in root .env}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-مدیر کل}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - database_network
      - frontend_backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: panel-hidary-frontend:latest
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    container_name: panel-hidary-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./Frontend/login:/usr/share/nginx/html/login:ro
      - ./Frontend/dashboard:/usr/share/nginx/html/dashboard:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./deploy/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_backend
      - shared_network

networks:
  shared_network:
    external: true
    name: shared_network
  frontend_backend:
    driver: bridge
  database_network:
    driver: bridge
    internal: true

volumes:
  panel_hidary_mysql_data:
    name: panel_hidary_mysql_data
  panel_hidary_postgres_data:
    name: panel_hidary_postgres_data
